<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1180" height="560" fill="#fafaf9"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a">Two-Stream Mamba + Vision-Mamba Architecture</text>
  <text x="24" y="54" font-size="12" fill="#64748b">transcribed from whiteboard sketch, 2026-09-12</text>

  <!-- Branch 1 -->
  <text x="24" y="120" font-size="13" font-weight="700" fill="#0f172a">Branch 1 — pose</text>
  <rect x="24" y="132" width="90" height="40" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="69" y="156" font-size="12" text-anchor="middle" fill="#0c4a6e">2 pos</text>

  <path d="M114,152 H196" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="155" y="144" font-size="11" text-anchor="middle" fill="#475569">29x, 18 feature</text>

  <rect x="196" y="132" width="130" height="40" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="261" y="156" font-size="12" text-anchor="middle" fill="#1e3a8a">Mamba model</text>

  <path d="M326,152 H408" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="408" y="132" width="150" height="40" rx="6" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="483" y="156" font-size="12" text-anchor="middle" fill="#312e81">Feature Extraction</text>

  <!-- Branch 2 -->
  <text x="24" y="240" font-size="13" font-weight="700" fill="#0f172a">Branch 2 — vision</text>
  <rect x="24" y="252" width="90" height="40" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="69" y="276" font-size="12" text-anchor="middle" fill="#0c4a6e">2 pos</text>

  <path d="M114,272 H196" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="155" y="264" font-size="11" text-anchor="middle" fill="#475569">player movements</text>

  <rect x="196" y="252" width="170" height="52" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="281" y="272" font-size="11.5" text-anchor="middle" fill="#78350f">Base frame</text>
  <text x="281" y="288" font-size="10.5" text-anchor="middle" fill="#78350f">(frame − base_frame)</text>

  <path d="M366,278 H408" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="387" y="270" font-size="10.5" text-anchor="middle" fill="#475569">each clip: 30</text>

  <rect x="408" y="252" width="150" height="52" rx="6" fill="#dcfce7" stroke="#15803d"/>
  <text x="483" y="273" font-size="12" text-anchor="middle" fill="#14532d">Vision Mamba</text>
  <text x="483" y="289" font-size="10" text-anchor="middle" fill="#14532d">(MambaBlock over frame tokens)</text>

  <path d="M558,278 H600" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="600" y="252" width="150" height="52" rx="6" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="675" y="273" font-size="12" text-anchor="middle" fill="#312e81">Feature Extraction</text>
  <text x="675" y="289" font-size="10" text-anchor="middle" fill="#312e81">(B, 30, D)</text>

  <!-- branch 1 extraction down to cross attn -->
  <path d="M483,172 V220 H675 V252" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="580" y="214" font-size="10" fill="#475569">(B, 29, D)</text>

  <!-- Cross attention + fusion -->
  <rect x="820" y="200" width="300" height="70" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="970" y="228" font-size="13" font-weight="700" text-anchor="middle" fill="#831843">Cross Attention</text>
  <text x="970" y="246" font-size="10.5" text-anchor="middle" fill="#831843">pose ⇄ vision, bidirectional multi-head</text>
  <text x="970" y="260" font-size="10.5" text-anchor="middle" fill="#831843">attn, mean-pooled each side</text>

  <path d="M750,278 V255 H820" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M558,152 H780 V235 H820" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="820" y="300" width="300" height="70" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="970" y="328" font-size="13" font-weight="700" text-anchor="middle" fill="#4c1d95">Feature Fusion</text>
  <text x="970" y="346" font-size="10.5" text-anchor="middle" fill="#4c1d95">concat(pose_attn, vision_attn)</text>
  <text x="970" y="360" font-size="10.5" text-anchor="middle" fill="#4c1d95">→ Linear → GELU → (B, D)</text>

  <path d="M970,270 V300" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="895" y="410" width="150" height="46" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="970" y="438" font-size="12" text-anchor="middle" fill="#7f1d1d">Head → logits</text>

  <path d="M970,370 V410" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- legend / base frame note -->
  <rect x="24" y="410" width="700" height="90" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="40" y="432" font-size="12" font-weight="700" fill="#0f172a">Base frame note</text>
  <text x="40" y="452" font-size="11" fill="#334155">Base frame = empty-court PNG per video (BASEFRAMES/base_frame/), built by</text>
  <text x="40" y="468" font-size="11" fill="#334155">per-pixel median across ~600 sampled frames — players drop out, court stays.</text>
  <text x="40" y="484" font-size="11" fill="#334155">It is the subtraction anchor for branch 2, not a direct model input.</text>
</svg>
